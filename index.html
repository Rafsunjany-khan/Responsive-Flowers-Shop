<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="assets/logo.png" alt="responsive flower shop logo">
        </div>
        <ul class="nav-menu">
            <li><strong>Home</strong></li>
            <li>Shop</li>
            <li>About us</li>
            <li><span class="material-icons">shopping_cart</span> Cart ($56)</li>
        </ul>
    </header>

    <section class="banner">
        <div class="banner-text">
            <h1><span class="black">ALWAYS</span> <span class="orange">FRESH</span></h1>
            <h1 class="orange">FLOWERS</h1>
            <p>
                Indulge your senses with the beauty and fragrance of our fresh flower shop.
                From classic roses to exotic blooms, we offer a wide variety of fresh flowers
                that are perfect for any occasion.
            </p>
        </div>
        <div class="banner-image">
            <img src="assets/hero-flower.png" alt="banner flowers">
        </div>
    </section>
</body>
</html>
